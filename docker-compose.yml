services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-familyhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-familyhub}
      POSTGRES_DB: ${POSTGRES_DB:-familyhub}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./fet-backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://familyhub:familyhub@db:5432/familyhub}
      TEST_DATABASE_URL: ${TEST_DATABASE_URL:-postgresql+psycopg://familyhub:familyhub@db:5432/familyhub_test}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-use-a-long-secret}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}"
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-demo@example.com}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-Demo123!}
      DEMO_USER_NAME: ${DEMO_USER_NAME:-Demo User}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  frontend:
    build: ./fet-ui
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
